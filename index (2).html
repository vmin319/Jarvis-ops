<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b16">
<title>JARVIS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  :root{
    --bg:#050b16; --panel:#0b1626; --line:#13304f; --cyan:#35e0ff; --blue:#2b7bff;
    --text:#e6f4ff; --muted:#7f9bb8; --me:#12335a; --ai:#0d1f35; --danger:#ff5a6e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;
    background:radial-gradient(900px 500px at 50% -10%,#0d2a4d55,transparent 70%),var(--bg);
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
  .brand{letter-spacing:.35em;font-weight:700;font-size:14px;color:var(--cyan)}
  .status{font-size:12px;color:var(--muted)}
  .icon-btn{background:none;border:1px solid var(--line);color:var(--text);width:38px;height:38px;
    border-radius:12px;font-size:18px;cursor:pointer}

  .orb-wrap{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
  .orb{width:112px;height:112px;border-radius:50%;position:relative;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#9ff3ff,#35e0ff 35%,#2b7bff 70%,#0a2a66);
    box-shadow:0 0 40px #35e0ff66,0 0 90px #2b7bff44, inset 0 0 30px #ffffff55;
    transition:transform .3s, box-shadow .3s}
  .orb::before,.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;
    border:1px solid #35e0ff55;animation:ring 3s linear infinite}
  .orb::after{inset:-28px;border-color:#2b7bff33;animation-duration:5s;animation-direction:reverse}
  @keyframes ring{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.04)}100%{transform:rotate(360deg) scale(1)}}
  .orb.idle{animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .orb.listening{animation:pulse .9s ease-in-out infinite;
    box-shadow:0 0 60px #35ff9a99,0 0 120px #35ff9a55, inset 0 0 30px #ffffff66;
    background:radial-gradient(circle at 35% 30%,#caffe6,#35ff9a 35%,#12b86a 70%,#064d2c)}
  .orb.thinking{animation:spin 1.2s linear infinite;filter:hue-rotate(60deg)}
  .orb.speaking{animation:talk .45s ease-in-out infinite;
    box-shadow:0 0 70px #35e0ffcc,0 0 140px #2b7bff77, inset 0 0 30px #ffffff77}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  .hint{margin-top:30px;font-size:12px;color:var(--muted);height:16px}

  #log{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  .msg{max-width:86%;padding:10px 13px;border-radius:16px;line-height:1.45;font-size:15px;
    border:1px solid var(--line);animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
  .ai{align-self:flex-start;background:var(--ai);border-bottom-left-radius:4px;white-space:pre-wrap}
  .ai img{display:block;width:100%;border-radius:12px;margin-top:8px;background:#0b1626;min-height:120px}
  .chip{display:inline-block;margin-top:8px;margin-right:6px;padding:7px 12px;border-radius:999px;
    background:linear-gradient(135deg,var(--blue),var(--cyan));color:#001;font-weight:600;font-size:13px;
    text-decoration:none}
  .chip.ghost{background:none;border:1px solid var(--cyan);color:var(--cyan)}

  .suggest{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}
  .suggest button{flex:none;background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}

  form{display:flex;gap:8px;padding:8px 12px 12px}
  input[type=text],input[type=password]{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
  input:focus{border-color:var(--cyan)}
  .send,.mic{border:none;border-radius:14px;width:48px;font-size:19px;cursor:pointer;color:#001;
    background:linear-gradient(135deg,var(--blue),var(--cyan))}
  .mic.on{background:linear-gradient(135deg,#12b86a,#35ff9a)}

  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;
    width:min(92vw,420px);padding:18px}
  dialog::backdrop{background:#000a}
  dialog h3{margin:0 0 12px;color:var(--cyan);letter-spacing:.1em;font-size:15px}
  dialog label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  dialog input{width:100%}
  .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
  .row button{border-radius:12px;border:1px solid var(--line);background:none;color:var(--text);padding:10px 14px;cursor:pointer}
  .row .primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#001;border:none;font-weight:700}
  small{color:var(--muted);display:block;margin-top:6px;line-height:1.4}
  select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font-size:15px;outline:none}
  input[type=range]{padding:0;accent-color:var(--cyan)}
  .testbtn{margin-top:12px;width:100%;border-radius:12px;border:1px solid var(--cyan);background:none;color:var(--cyan);padding:10px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">J.A.R.V.I.S</div>
    <div class="status" id="status">Online</div>
  </div>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
</header>

<div class="orb-wrap">
  <div class="orb idle" id="orb" role="button" aria-label="Talk to Jarvis"></div>
  <div class="hint" id="hint">Tap the orb and speak</div>
</div>

<div id="log" aria-live="polite"></div>

<div class="suggest" id="suggest">
  <button>Open YouTube</button>
  <button>Generate image of a neon city at night</button>
  <button>Play lofi music on YouTube</button>
  <button>Open Maps</button>
  <button>Tell me a joke</button>
</div>

<form id="form" autocomplete="off">
  <button type="button" class="mic" id="mic" aria-label="Voice">🎤</button>
  <input type="text" id="input" placeholder="Ask Jarvis anything…" enterkeyhint="send">
  <button class="send" aria-label="Send">➤</button>
</form>

<dialog id="settings">
  <h3>SETTINGS</h3>
  <label>Your name</label>
  <input type="text" id="setName" placeholder="Boss">
  <label>Gemini API key (chat + image generation)</label>
  <input type="password" id="setGKey" placeholder="AIza…">
  <label>Claude API key (optional, used if no Gemini key)</label>
  <input type="password" id="setKey" placeholder="sk-ant-…">
  <small>Keys are stored only in this browser. Without any key, Jarvis uses a free fallback AI. Get a Gemini key at aistudio.google.com.</small>
  <label>Voice language</label>
  <input type="text" id="setLang" placeholder="en-IN">
  <label>Voice</label>
  <select id="setVoice"></select>
  <label>Speed: <span id="rateVal"></span></label>
  <input type="range" id="setRate" min="0.6" max="1.5" step="0.05">
  <label>Pitch (low to high): <span id="pitchVal"></span></label>
  <input type="range" id="setPitch" min="0.5" max="1.8" step="0.05">
  <button type="button" class="testbtn" id="testVoice">▶ Test voice</button>
  <label><input type="checkbox" id="setSpeak" checked style="width:auto"> Speak replies aloud</label>
  <div class="row">
    <button id="clearBtn" type="button">Clear chat</button>
    <button id="closeBtn" type="button">Cancel</button>
    <button id="saveBtn" type="button" class="primary">Save</button>
  </div>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const log = $('log'), orb = $('orb'), hint = $('hint'), statusEl = $('status');
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v } catch { return d } },
    set(k, v){ try { localStorage.setItem(k, v) } catch {} }
  };
  const cfg = {
    name: store.get('j_name', 'Boss'),
    key: store.get('j_key', ''),
    gkey: store.get('j_gkey', ''),
    voiceName: store.get('j_voice', ''),
    rate: parseFloat(store.get('j_rate', '1.03')) || 1.03,
    pitch: parseFloat(store.get('j_pitch', '1.05')) || 1.05,
    lang: store.get('j_lang', 'en-IN'),
    speak: store.get('j_speak', '1') === '1'
  };
  let history = [];
  try { history = JSON.parse(store.get('j_hist', '[]')) } catch {}

  // ---------- App launcher ----------
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const APPS = {
    youtube:   { web:'https://www.youtube.com',        android:'intent://www.youtube.com/#Intent;package=com.google.android.youtube;scheme=https;end' },
    whatsapp:  { web:'https://wa.me/',                 android:'intent://send/#Intent;scheme=whatsapp;package=com.whatsapp;end' },
    instagram: { web:'https://www.instagram.com',      android:'intent://instagram.com/#Intent;package=com.instagram.android;scheme=https;end' },
    facebook:  { web:'https://www.facebook.com' },
    twitter:   { web:'https://x.com' }, x:{ web:'https://x.com' },
    gmail:     { web:'https://mail.google.com',        android:'intent://mail.google.com/#Intent;package=com.google.android.gm;scheme=https;end' },
    maps:      { web:'https://maps.google.com',        android:'intent://maps.google.com/#Intent;package=com.google.android.apps.maps;scheme=https;end' },
    'google maps': { web:'https://maps.google.com' },
    spotify:   { web:'https://open.spotify.com',       android:'intent://open.spotify.com/#Intent;package=com.spotify.music;scheme=https;end' },
    github:    { web:'https://github.com' },
    google:    { web:'https://www.google.com' },
    chatgpt:   { web:'https://chatgpt.com' },
    claude:    { web:'https://claude.ai' },
    telegram:  { web:'https://web.telegram.org', android:'intent://resolve/#Intent;scheme=tg;package=org.telegram.messenger;end' },
    linkedin:  { web:'https://www.linkedin.com' },
    amazon:    { web:'https://www.amazon.in' },
    flipkart:  { web:'https://www.flipkart.com' },
    netflix:   { web:'https://www.netflix.com' },
    drive:     { web:'https://drive.google.com' },
    photos:    { web:'https://photos.google.com' },
    translate: { web:'https://translate.google.com' },
    calendar:  { web:'https://calendar.google.com' },
    phone:     { web:'tel:' }, dialer:{ web:'tel:' },
    camera:    { android:'intent://#Intent;action=android.media.action.IMAGE_CAPTURE;end', web:'' },
    settings:  { android:'intent://#Intent;action=android.settings.SETTINGS;end', web:'' }
  };

  function launch(url){
    if (!url) return false;
    const w = window.open(url, '_blank');
    if (!w) { try { location.href = url } catch {} }
    return true;
  }
  function appUrl(a){ return (isAndroid && a.android) ? a.android : a.web }

  // ---------- Local intent detection ----------
  function detect(text){
    const t = text.trim();
    const l = t.toLowerCase().replace(/[.!?]+$/,'');

    let m = t.match(/(?:generate|create|make|draw|paint|imagine|show me)\s+(?:me\s+)?(?:an?\s+)?(?:image|photo|picture|pic|art|wallpaper|illustration)s?\s*(?:of|about|showing|with)?\s*(.+)/i);
    if (!m) m = t.match(/^(?:draw|paint|imagine)\s+(.+)/i);
    if (m && m[1]) return { type:'image', prompt: m[1].trim() };

    m = l.match(/^(?:play|search)\s+(.+?)\s+(?:on|in)\s+youtube$/) || l.match(/^youtube\s+(?:search\s+)?(.+)/);
    if (m) return { type:'open', label:'YouTube', url:'https://www.youtube.com/results?search_query='+encodeURIComponent(m[1]), say:`Playing ${m[1]} on YouTube.` };

    m = l.match(/^(?:call|dial)\s+([+\d][\d\s-]{5,})$/);
    if (m) return { type:'open', label:'Phone', url:'tel:'+m[1].replace(/[\s-]/g,''), say:`Dialing ${m[1]}.` };

    m = l.match(/^(?:navigate|directions|route|take me)\s+(?:to\s+)?(.+)/);
    if (m) return { type:'open', label:'Maps', url:'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(m[1]), say:`Getting directions to ${m[1]}.` };

    m = l.match(/^(?:google|search(?: for| google for)?|look up)\s+(.+)/);
    if (m) return { type:'open', label:'Google', url:'https://www.google.com/search?q='+encodeURIComponent(m[1]), say:`Searching for ${m[1]}.` };

    m = l.match(/^(?:open|launch|start|go to|run)\s+(?:the\s+)?(.+?)(?:\s+app)?$/);
    if (m){
      const name = m[1].trim();
      if (APPS[name]) {
        const a = APPS[name];
        const url = appUrl(a);
        if (url) return { type:'open', label:name, url, say:`Opening ${name} for you.` };
      }
      if (/^[a-z0-9-]+\.[a-z.]{2,}$/.test(name)) return { type:'open', label:name, url:'https://'+name, say:`Opening ${name}.` };
    }
    return null;
  }

  // ---------- UI helpers ----------
  function setState(s, txt){
    orb.className = 'orb ' + s;
    hint.textContent = txt || '';
  }
  function add(role, html){
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    if (typeof html === 'string') d.textContent = html; else d.appendChild(html);
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  function chip(label, url, ghost){
    const a = document.createElement('a');
    a.className = 'chip' + (ghost ? ' ghost' : '');
    a.textContent = label; a.href = url; a.target = '_blank'; a.rel = 'noopener';
    return a;
  }
  function save(){ store.set('j_hist', JSON.stringify(history.slice(-20))) }

  // ---------- Speech output ----------
  let voices = [];
  function loadVoices(){ voices = speechSynthesis.getVoices() }
  if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices }
  function pickVoice(o){
    o = o || cfg;
    if (o.voiceName){
      const m = voices.find(v => v.name === o.voiceName);
      if (m) return m;
    }
    const base = o.lang.split('-')[0];
    return voices.find(v => v.lang === o.lang && /female|google|natural/i.test(v.name))
        || voices.find(v => v.lang === o.lang)
        || voices.find(v => v.lang.startsWith(base)) || null;
  }
  function speak(text, force, o){
    o = o || cfg;
    return new Promise(res => {
      if ((!cfg.speak && !force) || !('speechSynthesis' in window)) return res();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[*_`#]/g,'').slice(0, 600));
      const v = pickVoice(o); if (v) u.voice = v;
      u.lang = o.lang; u.rate = o.rate; u.pitch = o.pitch;
      u.onstart = () => setState('speaking', 'Speaking…');
      u.onend = u.onerror = () => { setState('idle', 'Tap the orb and speak'); res() };
      speechSynthesis.speak(u);
    });
  }

  // ---------- Speech input ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  function listen(){
    if (!SR){ add('ai', 'Voice input is not supported in this browser. Please use Chrome on Android, or type instead.'); return }
    if (listening){ rec && rec.stop(); return }
    speechSynthesis.cancel();
    rec = new SR();
    rec.lang = cfg.lang; rec.interimResults = true; rec.continuous = false;
    let finalText = '';
    rec.onstart = () => { listening = true; $('mic').classList.add('on'); setState('listening', 'Listening…') };
    rec.onresult = e => {
      let t = '';
      for (const r of e.results){ t += r[0].transcript; if (r.isFinal) finalText = t }
      $('input').value = t;
    };
    rec.onerror = e => {
      setState('idle', e.error === 'not-allowed' ? 'Microphone permission denied' : 'Tap the orb and speak');
    };
    rec.onend = () => {
      listening = false; $('mic').classList.remove('on');
      const t = (finalText || $('input').value).trim();
      if (t){ $('input').value = ''; handle(t) } else setState('idle', 'Tap the orb and speak');
    };
    try { rec.start() } catch {}
  }

  // ---------- AI brain ----------
  // Model names can change over time; update them here if Google renames them.
  const GEMINI_CHAT  = 'gemini-2.5-flash';
  const GEMINI_IMAGE = 'gemini-2.5-flash-image';
  function systemPrompt(){
    return `You are JARVIS, a witty, warm, friendly personal AI assistant living on the user's phone. The user's name is ${cfg.name}. ` +
      `Talk like a smart friend: natural, upbeat, a little playful, never robotic. Keep replies short (1-3 sentences) because they are spoken aloud, ` +
      `unless the user asks for detail. Do not use markdown or emojis. The app itself can open apps, search, navigate, and generate images ` +
      `when the user says things like "open YouTube" or "generate image of a dragon"; if they ask what you can do, mention that.`;
  }
  async function askAI(){
    const msgs = history.slice(-12);
    if (cfg.gkey){
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_CHAT}:generateContent`, {
        method:'POST',
        headers:{ 'content-type':'application/json', 'x-goog-api-key': cfg.gkey },
        body: JSON.stringify({
          systemInstruction:{ parts:[{ text: systemPrompt() }] },
          contents: msgs.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts:[{ text: m.content }] })),
          generationConfig:{ maxOutputTokens: 800, thinkingConfig:{ thinkingBudget: 0 } }
        })
      });
      if (!r.ok) throw new Error('Gemini API error ' + r.status + ' (check your key in settings)');
      const j = await r.json();
      const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
      const out = parts.map(p => p.text || '').join('').trim();
      if (!out) throw new Error('Gemini returned an empty reply');
      return out;
    }
    if (cfg.key){
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{
          'content-type':'application/json',
          'x-api-key': cfg.key,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body: JSON.stringify({ model:'claude-sonnet-5-5', max_tokens:400, system: systemPrompt(), messages: msgs })
      });
      if (!r.ok) throw new Error('Claude API error ' + r.status);
      const j = await r.json();
      return j.content.map(c => c.text || '').join('').trim();
    }
    // Free fallback (no key). Quality and uptime may vary.
    const r = await fetch('https://text.pollinations.ai/openai', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ model:'openai', messages:[{role:'system', content:systemPrompt()}, ...msgs] })
    });
    if (!r.ok) throw new Error('Fallback AI error ' + r.status);
    const j = await r.json();
    return j.choices[0].message.content.trim();
  }

  // ---------- Image generation ----------
  async function geminiImage(prompt){
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_IMAGE}:generateContent`, {
      method:'POST',
      headers:{ 'content-type':'application/json', 'x-goog-api-key': cfg.gkey },
      body: JSON.stringify({
        contents:[{ parts:[{ text: prompt }] }],
        generationConfig:{ responseModalities:['IMAGE'] }
      })
    });
    if (!r.ok) throw new Error('Gemini image error ' + r.status);
    const j = await r.json();
    const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
    const hit = parts.find(p => p.inlineData || p.inline_data);
    if (!hit) throw new Error('No image returned');
    const d = hit.inlineData || hit.inline_data;
    const bin = atob(d.data), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: d.mimeType || d.mime_type || 'image/png' }));
  }

  function makeImage(prompt){
    const wrap = document.createElement('div');
    const p = document.createElement('div'); p.textContent = `Working on "${prompt}"…`;
    wrap.append(p);

    const show = (url, source) => {
      const img = new Image(); img.alt = prompt; img.src = url;
      img.onload = () => { p.textContent = `Here you go, ${cfg.name}. "${prompt}"${source ? ' (' + source + ')' : ''}`; log.scrollTop = log.scrollHeight };
      img.onerror = () => { p.textContent = 'The image service is busy. Try again in a moment.' };
      const open = chip('Open full size', url);
      const again = chip('Another', '#', true);
      again.addEventListener('click', e => { e.preventDefault(); handle('generate image of ' + prompt) });
      wrap.append(img, open, again);
    };
    const free = () => {
      const seed = Math.floor(Math.random() * 1e6);
      show(`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=768&height=768&nologo=true&seed=${seed}`, 'free model');
    };

    if (cfg.gkey){
      geminiImage(prompt).then(url => show(url, 'Gemini')).catch(() => free());
    } else {
      free();
    }
    return wrap;
  }

  // ---------- Main handler ----------
  let busy = false;
  async function handle(text){
    if (busy) return;
    busy = true;
    add('me', text);
    const intent = detect(text);
    try {
      if (intent && intent.type === 'image'){
        setState('thinking', 'Creating image…');
        add('ai', makeImage(intent.prompt));
        await speak(`Creating that image for you, ${cfg.name}.`);
      } else if (intent && intent.type === 'open'){
        const box = document.createElement('div');
        box.append(document.createTextNode(intent.say + ' '), document.createElement('br'),
                   chip('Tap if it did not open', intent.url));
        add('ai', box);
        await speak(intent.say);
        launch(intent.url);
      } else {
        setState('thinking', 'Thinking…');
        history.push({ role:'user', content:text });
        const reply = await askAI();
        history.push({ role:'assistant', content:reply }); save();
        add('ai', reply);
        await speak(reply);
      }
    } catch (err){
      history.pop();
      add('ai', 'Sorry, I hit a problem: ' + err.message + ((cfg.key || cfg.gkey) ? '' : '. Adding a Gemini API key in settings usually fixes this.'));
      setState('idle', 'Tap the orb and speak');
    }
    busy = false;
    setState('idle', 'Tap the orb and speak');
  }

  // ---------- Wiring ----------
  $('form').addEventListener('submit', e => { e.preventDefault(); const t = $('input').value.trim(); if (t){ $('input').value = ''; handle(t) } });
  $('mic').addEventListener('click', listen);
  orb.addEventListener('click', listen);
  $('suggest').addEventListener('click', e => { if (e.target.tagName === 'BUTTON') handle(e.target.textContent) });

  const dlg = $('settings');
  $('settingsBtn').onclick = () => {
    $('setName').value = cfg.name; $('setGKey').value = cfg.gkey; $('setKey').value = cfg.key; $('setLang').value = cfg.lang; $('setSpeak').checked = cfg.speak;
    $('setRate').value = cfg.rate; $('setPitch').value = cfg.pitch;
    $('rateVal').textContent = cfg.rate; $('pitchVal').textContent = cfg.pitch;
    fillVoices();
    dlg.showModal();
  };
  function fillVoices(){
    const sel = $('setVoice');
    const lang = $('setLang').value.trim() || cfg.lang, base = lang.split('-')[0];
    const list = voices.slice().sort((a, b) =>
      (b.lang.startsWith(base) - a.lang.startsWith(base)) || a.name.localeCompare(b.name));
    sel.textContent = '';
    const auto = document.createElement('option');
    auto.value = ''; auto.textContent = 'Auto (best match)';
    sel.appendChild(auto);
    list.forEach(v => {
      const o = document.createElement('option');
      o.value = v.name; o.textContent = `${v.name} (${v.lang})`;
      sel.appendChild(o);
    });
    sel.value = cfg.voiceName;
  }
  $('setLang').addEventListener('change', fillVoices);
  $('setRate').addEventListener('input', e => { $('rateVal').textContent = e.target.value });
  $('setPitch').addEventListener('input', e => { $('pitchVal').textContent = e.target.value });
  $('testVoice').onclick = () => {
    const name = $('setName').value.trim() || cfg.name;
    speak(`Hi ${name}, this is how I sound. How can I help you today?`, true, {
      lang: $('setLang').value.trim() || cfg.lang,
      voiceName: $('setVoice').value,
      rate: parseFloat($('setRate').value),
      pitch: parseFloat($('setPitch').value)
    });
  };
  $('closeBtn').onclick = () => { speechSynthesis.cancel(); dlg.close() };
  $('saveBtn').onclick = () => {
    cfg.name = $('setName').value.trim() || 'Boss'; cfg.key = $('setKey').value.trim(); cfg.gkey = $('setGKey').value.trim();
    cfg.lang = $('setLang').value.trim() || 'en-IN'; cfg.speak = $('setSpeak').checked;
    cfg.voiceName = $('setVoice').value;
    cfg.rate = parseFloat($('setRate').value) || 1.03;
    cfg.pitch = parseFloat($('setPitch').value) || 1.05;
    speechSynthesis.cancel();
    store.set('j_voice', cfg.voiceName); store.set('j_rate', String(cfg.rate)); store.set('j_pitch', String(cfg.pitch));
    store.set('j_name', cfg.name); store.set('j_key', cfg.key); store.set('j_gkey', cfg.gkey); store.set('j_lang', cfg.lang); store.set('j_speak', cfg.speak ? '1' : '0');
    dlg.close();
  };
  $('clearBtn').onclick = () => { history = []; save(); log.innerHTML = ''; greet(); dlg.close() };

  function greet(){
    const h = new Date().getHours();
    const part = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    add('ai', `${part}, ${cfg.name}. I'm Jarvis. Tap the orb and tell me what to do: open an app, search something, generate an image, or just chat.`);
  }
  greet();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
